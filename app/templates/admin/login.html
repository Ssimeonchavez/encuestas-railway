{% extends "base.html" %}

{% block title %}Login Admin{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4 fade-up">
            <h3 class="text-center mb-4">🔐 Acceso Administrador</h3>
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <div class="mt-4 text-center text-muted small">
                <p>Usuario por defecto: admin / admin123</p>
                <p>Crear admin: <a href="{{ url_for('admin.setup') }}">/admin/setup</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
